[workspace]
members = [
	"mountpoint-s3-crt",
	"mountpoint-s3-crt-sys",
	"mountpoint-s3-client",
	"mountpoint-s3",
	"mountpoint-s3-fs",
]
# The vendored fuser fork and the transfer manager submodule declare their own `[workspace]` in their Cargo.toml,
# so they can't be members here. They are built only as path dependencies.
exclude = ["mountpoint-s3-fuser", "third_party/aws-s3-transfer-manager-rs"]
resolver = "2"

[workspace.dependencies]
mountpoint-s3-fs = { version = "0.13.0", path = "./mountpoint-s3-fs" }
mountpoint-s3-client = { version = "0.24.0", path = "./mountpoint-s3-client" }
mountpoint-s3-crt = { version = "0.18.0", path = "./mountpoint-s3-crt" }
mountpoint-s3-crt-sys = { version = "0.18.1", path = "./mountpoint-s3-crt-sys" }
mountpoint-s3-fuser = { version = "0.2.0", path = "./mountpoint-s3-fuser", features = ["abi-7-28", "libfuse"] }

[profile.release]
debug = 2
opt-level = 3
lto = true # Link-time optimization
codegen-units = 1  # Single compilation unit for better optimization
