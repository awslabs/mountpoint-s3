[package]
name = "mountpoint-s3-crt-sys"
# See `/doc/PUBLISHING_CRATES.md` to read how to publish new versions.
version = "0.18.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/awslabs/mountpoint-s3"
description = "Rust FFI bindings to the AWS Common Runtime for Mountpoint for Amazon S3."
exclude = [
    # Exclude large files/directories not required to build the CRT (e.g. tests, docs)
    "crt/*/samples/**",
    "crt/*/tests",
    "!crt/s2n-tls/tests/features",
    "crt/*/verification",
    "crt/*/include/aws/testing",
    "crt/**/docs",
    "crt/aws-c-cal/ecdsa-fuzz-corpus/*",
    "crt/aws-c-common/verification/*",
    "crt/aws-c-common/AWSCRTAndroidTestRunner",
    "crt/aws-c-s3/benchmarks",
    "crt/s2n-tls/compliance/*",
    "crt/s2n-tls/docker-images/*",
    "crt/s2n-tls/nix/*",
    "crt/s2n-tls/scram/SCRAM_paper.pdf",
    "**/.github/**",
    "**/*.jar",
    "**/*.md",
    "**/*.png",
    "**/.gitignore",
    "**/.clang-format",
    "**/.clang-tidy",
    "**/README",
    "**/CONTRIBUTORS",
    "**/format-check.py",
    "**/format-check.sh",
    "**/codebuild/**",
    "**/codereview.settings",
    "**/.builder/**",
]

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = [
    "runtime",
] }
cc = "1.2.65"
cmake = "0.1.58"
rustflags = "0.1.7"
which = "8.0.4"

[dependencies]
libc = "0.2.186"
# The requirement must stay semver-compatible with the one of `aws-lc-rs` (used by rustls), otherwise
# Cargo builds a second `aws-lc-sys` and a binary using both links two aws-lc libraries.
aws-lc-sys = { version = "0.47.0", default-features = false }

[lib]
# this prevents C docs being interpreted as rustdoc tests after bindgen
doctest = false
