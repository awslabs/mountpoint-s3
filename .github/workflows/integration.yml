name: Integration tests

# We use environments to require approval to run integration tests on PRs, but not on pushes to
# `main` (which have been approved already since PRs are required for `main`).
on:
  workflow_call:
    inputs:
      environment:
        type: string
      ref:
        required: true
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  S3_SECOND_BUCKET_NAME: ${{ vars.S3_SECOND_BUCKET_NAME }}
  S3_EXPRESS_ONE_ZONE_BUCKET_NAME: ${{ vars.S3_EXPRESS_ONE_ZONE_BUCKET_NAME }}
  # Optional endpoint urls, can be empty
  S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
  S3_EXPRESS_ONE_ZONE_ENDPOINT_URL: ${{ vars.S3_EXPRESS_ONE_ZONE_ENDPOINT_URL }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_BUCKET_TEST_PREFIX: ${{ vars.S3_BUCKET_TEST_PREFIX || 'github-actions-tmp/' }}run-${{ github.run_id }}/attempt-${{ github.run_attempt }}/
  # An IAM role that tests can assume when they want to create session policies
  S3_SUBSESSION_IAM_ROLE: ${{ vars.S3_SUBSESSION_IAM_ROLE }}
  # IAM role used to test the web_identity_token_file credential source
  S3_WEB_IDENTITY_TEST_ROLE_ARN: ${{ vars.S3_WEB_IDENTITY_TEST_ROLE_ARN }}
  # Different Access Points Aliases and ARNs
  S3_ACCESS_POINT_ALIAS: ${{ vars.S3_ACCESS_POINT_ALIAS }}
  S3_ACCESS_POINT_ARN: ${{ vars.S3_ACCESS_POINT_ARN }}
  S3_OLAP_ALIAS: ${{ vars.S3_OLAP_ALIAS }}
  S3_OLAP_ARN: ${{ vars.S3_OLAP_ARN }}
  S3_MRAP_ARN: ${{ vars.S3_MRAP_ARN }}
  S3_BUCKET_OWNER: ${{ vars.S3_BUCKET_OWNER }}
  S3_EXPRESS_ONE_ZONE_BUCKET_NAME_EXTERNAL: ${{ vars.S3_EXPRESS_ONE_ZONE_BUCKET_NAME_EXTERNAL }}
  KMS_TEST_KEY_ID: ${{ vars.KMS_TEST_KEY_ID }}
  S3_EXPRESS_ONE_ZONE_BUCKET_NAME_SSE_KMS: ${{ vars.S3_EXPRESS_ONE_ZONE_BUCKET_NAME_SSE_KMS }}
  # Optionally pin the OpenTelemetry Collector version instead of installing the latest release.
  OVERRIDE_OTEL_COLLECTOR_VERSION: ${{ vars.OVERRIDE_OTEL_COLLECTOR_VERSION }}

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Approval Gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Approval Gate
        run: echo "Approved!"

  fs-test:
    name: FS Tests (${{ matrix.bucket-type.name }}, ${{ matrix.runner.name }}, FUSE ${{ matrix.fuseVersion }})
    runs-on: ${{ matrix.runner.tags }}

    needs: approval
    env:
      features: fuse_tests,s3_tests,fips_tests,event_log,second_account_tests,manifest,${{ matrix.bucket-type.feature }}
      packages: --package mountpoint-s3 --package mountpoint-s3-fs

    strategy:
      fail-fast: false
      matrix:
        bucket-type:
        - name: S3
          feature:
        - name: S3XOZ
          feature: s3express_tests
        fuseVersion: [2, 3]
        runner:
        - name: Ubuntu x86
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: AL2023 arm
          tags: [self-hosted, linux, arm64]

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        aws-region: ${{ vars.S3_REGION }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: true
        persist-credentials: false
        # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
        allow-unsafe-pr-checkout: true
    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Allow warnings in `mountpoint-s3-fuser`.
        build-warnings: "warn"
    - name: Install nextest
      uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: nextest
    - name: Install operating system dependencies
      uses: ./.github/actions/install-dependencies
      with:
        fuseVersion: ${{ matrix.fuseVersion }}
    - name: Build tests
      run: cargo nextest run --profile ci ${{ env.packages }} --features '${{ env.features }}' --no-run
    - name: Run tests
      run: cargo nextest run --profile ci ${{ env.packages }} --features '${{ env.features }}'
    - name: Save dump files
      if: ${{ failure() && matrix.runner.name == 'AL2023 arm' }}
      run: ./.github/actions/scripts/save-coredump.sh

  client-test:
    name: Client Tests (${{ matrix.bucket-type.name }}, ${{ matrix.runner.name }}, ${{ matrix.pool.name }})
    runs-on: ${{ matrix.runner.tags }}

    needs: approval
    env:
      features: s3_tests,fips_tests,web_identity_tests,${{ matrix.pool.feature }},${{ matrix.bucket-type.feature }}
      packages: --package mountpoint-s3-client --package mountpoint-s3-crt --package mountpoint-s3-crt-sys

    strategy:
      fail-fast: false
      matrix:
        bucket-type:
        - name: S3
          feature:
        - name: S3XOZ
          feature: s3express_tests
        runner:
        - name: Ubuntu x86
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: AL2023 arm
          tags: [self-hosted, linux, arm64]
        pool:
        - name: Default Pool
          feature:
        - name: Test Pool
          feature: pool_tests
        - name: FS Pool
          feature: fs_pool_tests

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        aws-region: ${{ vars.S3_REGION }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: true
        persist-credentials: false
        # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
        allow-unsafe-pr-checkout: true
    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Allow warnings in `mountpoint-s3-fuser`.
        build-warnings: "warn"
    - name: Install nextest
      uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: nextest
    - name: Install operating system dependencies
      uses: ./.github/actions/install-dependencies
      with:
        # not required for client tests. TODO: make it optional.
        fuseVersion: 2
    - name: Build tests
      run: cargo nextest run --profile ci ${{ env.packages }} --features '${{ env.features }}' --no-run
    - name: Fetch a GitHub Actions OIDC token for web identity tests
      # Requests a fresh, real OIDC token distinct from the one used above to assume
      # ACTIONS_IAM_ROLE, so tests can exercise the web_identity_token_file credential source
      # by assuming S3_WEB_IDENTITY_TEST_ROLE_ARN with it.
      run: |
        set -euo pipefail
        token=$(curl -sf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
        token_file="${RUNNER_TEMP}/web_identity_token"
        echo "$token" > "$token_file"
        echo "S3_WEB_IDENTITY_TEST_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
    - name: Run tests
      run: cargo nextest run --profile ci ${{ env.packages }} --features '${{ env.features }}'
    - name: Clean up web identity token
      if: always()
      run: rm -f "${S3_WEB_IDENTITY_TEST_TOKEN_FILE}"
    - name: Save dump files
      if: ${{ failure() && matrix.runner.name == 'AL2023 arm' }}
      run: ./.github/actions/scripts/save-coredump.sh

  fstab:
    name: fstab tests (${{ matrix.runner.name }})
    runs-on: ${{ matrix.runner.tags }}

    needs: approval

    strategy:
      fail-fast: false
      matrix:
        fuseVersion: [2]
        runner:
          - name: Ubuntu x86
            tags: [ubuntu-22.04] # GitHub-hosted
          - name: AL2023 arm
            tags: [self-hosted, linux, arm64]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
          aws-region: ${{ vars.S3_REGION }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
          # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
          allow-unsafe-pr-checkout: true
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Allow warnings in `mountpoint-s3-fuser`.
          build-warnings: "warn"
      - name: Install operating system dependencies
        uses: ./.github/actions/install-dependencies
        with:
          fuseVersion: ${{ matrix.fuseVersion }}
      - name: Create aws profile
        # Run the aws configuration as root, as fstab runs Mountpoint as root by default.
        run: |
          sudo aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          sudo aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          sudo aws configure set aws_session_token $AWS_SESSION_TOKEN
      - name: Run fstab integration tests
        run: ./mountpoint-s3/tests/fstab/basic_checks.sh

  asan:
    name: Address sanitizer
    runs-on: [self-hosted, linux, arm64]

    needs: approval

    env:
      # We're using ASan to test our CRT bindings, so focus only on S3, not on FUSE
      RUST_FEATURES: s3_tests,fips_tests

    timeout-minutes: 30

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        aws-region: ${{ vars.S3_REGION }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: true
        persist-credentials: false
        # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
        allow-unsafe-pr-checkout: true
    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # Allow warnings in `mountpoint-s3-fuser`.
        build-warnings: "warn"
        components: rust-src
    - name: Install nextest
      uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: nextest
    - name: Install operating system dependencies
      uses: ./.github/actions/install-dependencies
      with:
        fuseVersion: 3
        llvm: true
    - name: Validate ASan is working
      run: make test-asan-working
    - name: Run tests
      run: make test-asan
    - name: Save dump files
      if: ${{ failure() }}
      run: ./.github/actions/scripts/save-coredump.sh

  metrics:
    name: Metrics Tests (${{ matrix.runner.name }})
    runs-on: ${{ matrix.runner.tags }}

    needs: approval

    strategy:
      fail-fast: false
      matrix:
        runner:
        - name: Ubuntu x86
          tags: [ubuntu-22.04]
        - name: AL2023 arm
          tags: [self-hosted, linux, arm64]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
          aws-region: ${{ vars.S3_REGION }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
          # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
          allow-unsafe-pr-checkout: true
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Allow warnings in `mountpoint-s3-fuser`.
          build-warnings: "warn"
      - name: Install operating system dependencies
        uses: ./.github/actions/install-dependencies
        with:
          fuseVersion: 2
          otelcol: true
      - name: Run OTLP metrics tests
        id: metrics-tests
        run: ./mountpoint-s3/tests/metrics/otel_export.sh
        env:
          FAILED_LOGS_DIR: ${{ github.workspace }}/metrics-test-logs
      - name: Upload Mountpoint logs of failed metrics tests
        if: failure() && steps.metrics-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-test-logs-${{ matrix.runner.name }}
          path: ${{ github.workspace }}/metrics-test-logs
          retention-days: 3
          if-no-files-found: warn

  build-srpm:
    name: Build SRPM
    needs: approval
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dist: [2023, 2027]

    container:
      image: amazonlinux:${{ matrix.dist }}

    steps:
    - name: Install build tools and dependencies
      run: |
        dnf -y install git rpm-build rpmdevtools rust cargo wget
        wget -q "https://github.com/EmbarkStudios/cargo-about/releases/download/0.8.2/cargo-about-0.8.2-$(uname -m)-unknown-linux-musl.tar.gz" && \
        wget -q "https://github.com/EmbarkStudios/cargo-about/releases/download/0.8.2/cargo-about-0.8.2-$(uname -m)-unknown-linux-musl.tar.gz.sha256" && \
        echo -n "$(sha256sum cargo-about-*.tar.gz | cut -d' ' -f1)" > checksum.sha256 && \
        diff cargo-about-*.tar.gz.sha256 checksum.sha256 && \
        tar xzf cargo-about-*.tar.gz && \
        cp cargo-about-*/cargo-about /usr/bin && \
        rm -rf cargo-about-* checksum.sha256

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: true
        persist-credentials: false
        # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
        allow-unsafe-pr-checkout: true

    - name: Create SRPM
      id: build-srpm
      run: |
        chmod +x package/generate_amzn_srpm.sh
        ./package/generate_amzn_srpm.sh "amzn${{ matrix.dist }}"

        echo "## Generated Amazon Linux ${{ matrix.dist }} Spec File" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```spec' >> $GITHUB_STEP_SUMMARY
        cat ~/rpmbuild/SPECS/amzn${{ matrix.dist }}.spec >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload SRPM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: srpm-package-${{ matrix.dist }}
        path: ~/rpmbuild/SRPMS/mount-s3-*.src.rpm
        retention-days: 1

  test-rpm:
    name: Test Amazon Linux ${{ matrix.dist }} RPM on ${{ matrix.runner.arch }}
    needs: [build-srpm, approval]
    runs-on: ${{ matrix.runner.tags }}
    env:
      test-prefix: "${S3_BUCKET_TEST_PREFIX}test-rpm/amzn${{ matrix.dist }}-${{ matrix.runner.arch }}/"

    strategy:
      fail-fast: false
      matrix:
        dist: [2023, 2027]
        runner:
        - arch: x86_64
          tags: [ubuntu-22.04] # GitHub-hosted
        - arch: aarch64
          tags: [self-hosted, linux, arm64]
        
    container:
      image: amazonlinux:${{ matrix.dist }}
      options: --privileged

    steps:
    - name: Install build tools and dependencies
      run: |
        dnf -y install make mock ca-certificates sudo awscli

    - name: Preventing container PAM sudo errors
      run: |
        # https://github.com/geerlingguy/docker-rockylinux9-ansible/issues/6
        chmod 0400 /etc/shadow

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        aws-region: ${{ vars.S3_REGION }}

    - name: Download SRPM artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: srpm-package-${{ matrix.dist }}
        path: /tmp/srpms

    - name: Resolve SRPM version tag
      id: srpm
      run: echo "version-tag=$(basename /tmp/srpms/mount-s3-*.src.rpm .src.rpm | sed 's/^mount-s3-//')" >> "$GITHUB_OUTPUT"

    - name: Test RPM build with Mock in Amazon Linux ${{ matrix.dist }} chroot
      run: |
        VERSION_TAG="${{ steps.srpm.outputs.version-tag }}"
        sudo mock -r amazonlinux-${{ matrix.dist }}-${{ matrix.runner.arch }} --rebuild /tmp/srpms/mount-s3-${VERSION_TAG}.src.rpm

    - name: Build log
      if: always()
      run: |
        echo "Mock build log:"
        cat /var/lib/mock/amazonlinux-${{ matrix.dist }}-${{ matrix.runner.arch }}/result/build.log

    - name: Test RPM installation
      run: |
        VERSION_TAG="${{ steps.srpm.outputs.version-tag }}"
        dnf -y install /var/lib/mock/amazonlinux-${{ matrix.dist }}-${{ matrix.runner.arch }}/result/mount-s3-${VERSION_TAG}.${{ matrix.runner.arch }}.rpm
        which mount-s3
        mount-s3 --version
        mount-s3 --help

    - name: Basic Functionality Tests
      run: |
        mkdir -p /mnt/s3-test

        # Read Test
        echo "Hello from RPM test" | aws s3 cp - "s3://${S3_BUCKET_NAME}/${{ env.test-prefix }}test.txt"
        mount-s3 "${S3_BUCKET_NAME}" /mnt/s3-test --prefix="${{ env.test-prefix }}" --region="${S3_REGION}"
        cat /mnt/s3-test/test.txt | grep -q "Hello from RPM test"

        # Write Test
        echo "Hello from RPM write test" > /mnt/s3-test/write-test.txt
        aws s3 cp "s3://${S3_BUCKET_NAME}/${{ env.test-prefix }}write-test.txt" - | grep -q "Hello from RPM write test"

        sudo umount /mnt/s3-test

    - name: Cleanup test resources
      if: always()
      run: |
        aws s3 rm "s3://${S3_BUCKET_NAME}/${{ env.test-prefix }}test.txt"
        aws s3 rm "s3://${S3_BUCKET_NAME}/${{ env.test-prefix }}write-test.txt"

  packaging:
    name: Package ${{ matrix.runner.name }}
    needs: approval
    runs-on: ${{ matrix.runner.tags }}

    strategy:
      # The two architectures are independent, so don't let a failure on one cancel an
      # otherwise healthy build on the other.
      fail-fast: false
      matrix:
        runner:
        - name: x86_64
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: aarch64
          tags: [self-hosted, linux, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: true
        persist-credentials: false
        # Allow fork PR checkouts since we gate deployments and the code only has access to ephemeral test cluster
        allow-unsafe-pr-checkout: true

    - name: Install operating system dependencies
      uses: ./.github/actions/install-dependencies
      with:
        fuseVersion: 2

    # Anonymous pulls from Amazon ECR Public are rate limited per source IP, and GitHub-hosted
    # runners share a NAT pool with other tenants, so we regularly inherit an exhausted budget
    # and the build image pull fails with `429 ... Data limit exceeded`. Authenticating lets us
    # use the account quota instead.
    #
    # Where we can't authenticate we fall back to an anonymous pull.
    - name: Configure AWS credentials for Amazon ECR Public
      id: aws-credentials
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        # ECR Public only serves its authorization API from us-east-1.
        aws-region: us-east-1

    - name: Log in to Amazon ECR Public
      if: steps.aws-credentials.outcome == 'success'
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registry-type: public

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        tags: mountpoint-builder
        context: ./package
        # https://github.com/docker/buildx/issues/379
        ulimit: nofile=100000

    - name: Package an unofficial release
      run: docker run --mount type=bind,source=$(pwd),target=/mountpoint mountpoint-builder

    - name: Check release binary
      run: mkdir ./pkg-out && tar -xzf ./out/mount-s3*.tar.gz -C ./pkg-out && ./pkg-out/bin/mount-s3 --version

    - name: Check the binary's shared-library requirements against the baseline
      env:
        ARCH: ${{ matrix.runner.name }}
      run: |
        python3 .github/actions/scripts/check_shared_libs.py --binary ./pkg-out/bin/mount-s3 \
          --baseline ".github/actions/scripts/shared_lib_baselines/${ARCH}.json"

    - name: Upload unofficial packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages-${{ matrix.runner.name }}
        path:  ./out/*
        retention-days: 3
        if-no-files-found: error

  test-packages:
    name: Test ${{ matrix.distro.name }} package on ${{ matrix.arch.name }}
    needs: [packaging, approval]
    runs-on: ${{ matrix.arch.tags }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        arch:
        - name: x86_64
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: aarch64
          tags: [self-hosted, linux, arm64]
        distro:
        - name: CentOS 7
          id: centos7
          image: public.ecr.aws/docker/library/centos:7
        - name: RHEL 8
          id: rhel8
          image: registry.access.redhat.com/ubi8/ubi
        - name: RHEL 9
          id: rhel9
          image: registry.access.redhat.com/ubi9/ubi
        - name: Amazon Linux 2023
          id: al2023
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
        - name: Ubuntu
          id: ubuntu
          image: public.ecr.aws/ubuntu/ubuntu:24.04
        - name: openSUSE Leap 15
          id: opensuse
          image: registry.opensuse.org/opensuse/leap:15

    steps:
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ vars.ACTIONS_IAM_ROLE }}
        # ECR Public only serves its authorization API from us-east-1.
        aws-region: us-east-1

    - name: Log in to Amazon ECR Public
      # Don't fail the job if ECR Public auth transiently fails: the non-ECR images don't need it and the pull loop retries.
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registry-type: public

    - name: Download the packages built for this architecture
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: packages-${{ matrix.arch.name }}
        path: ./pkgs

    - name: Install the package and mount the test bucket read-only
      env:
        DISTRO_ID: ${{ matrix.distro.id }}
        IMAGE: ${{ matrix.distro.image }}
        MOUNT_BUCKET: ${{ env.S3_BUCKET_NAME }}
        MOUNT_PREFIX: ${{ env.S3_BUCKET_TEST_PREFIX }}test-packages/${{ matrix.distro.id }}-${{ matrix.arch.name }}/
        MOUNT_REGION: ${{ env.S3_REGION }}
        SCRIPT: |
          set -euo pipefail
          pkg_rpm()  { local f; for f in /pkgs/mount-s3-*.rpm; do [ "$f" = "${f%.suse.rpm}" ] && { echo "$f"; return; }; done; }
          pkg_suse() { local f; for f in /pkgs/mount-s3-*.suse.rpm; do echo "$f"; return; done; }
          pkg_deb()  { local f; for f in /pkgs/mount-s3-*.deb; do echo "$f"; return; done; }
          case "$DISTRO_ID" in
            centos7)
              # CentOS 7 is EOL; its mirrors moved to vault.centos.org (altarch on aarch64).
              sed -i 's/mirror.centos.org/vault.centos.org/g' /etc/yum.repos.d/*.repo
              sed -i 's/^#.*baseurl=http/baseurl=https/g' /etc/yum.repos.d/*.repo
              sed -i 's/^mirrorlist=http/#mirrorlist=https/g' /etc/yum.repos.d/*.repo
              if [ "$(uname -m)" = "aarch64" ]; then sed -i 's|vault.centos.org/centos|vault.centos.org/altarch|g' /etc/yum.repos.d/*.repo; fi
              yum install -y "$(pkg_rpm)" ;;
            rhel8|rhel9|al2023)
              dnf install -y "$(pkg_rpm)" ;;
            ubuntu)
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get install -y "$(pkg_deb)" ;;
            opensuse)
              zypper --no-gpg-checks -n install -y "$(pkg_suse)" ;;
            *) echo "unknown distro id: $DISTRO_ID" >&2; exit 1 ;;
          esac
          mount-s3 --version
          mkdir -p /mnt/mp
          args=( "$MOUNT_BUCKET" /mnt/mp --read-only )
          [ -n "${MOUNT_PREFIX:-}" ] && args+=( "--prefix=$MOUNT_PREFIX" )
          [ -n "${MOUNT_REGION:-}" ] && args+=( "--region=$MOUNT_REGION" )
          [ -n "${MOUNT_EXTRA_ARGS:-}" ] && args+=( $MOUNT_EXTRA_ARGS )
          mount-s3 "${args[@]}"
          ls /mnt/mp
          fusermount -u /mnt/mp 2>/dev/null || umount /mnt/mp
          echo "OK: ${DISTRO_ID} $(uname -m)"
      run: |
        set -euo pipefail
        ok=
        for attempt in 1 2 3 4 5; do
          docker pull "$IMAGE" && { ok=1; break; }
          echo "pull attempt ${attempt} for ${IMAGE} failed; retrying" >&2
          sleep $((attempt * 15))
        done
        # A failing pull inside the && above does not trip set -e, so fail explicitly if none succeeded.
        [ -n "$ok" ] || { echo "could not pull ${IMAGE} after 5 attempts" >&2; exit 1; }
        docker run --rm --privileged --device /dev/fuse \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e DISTRO_ID -e MOUNT_BUCKET -e MOUNT_PREFIX -e MOUNT_REGION -e MOUNT_EXTRA_ARGS \
          -v "$PWD/pkgs:/pkgs:ro" \
          "$IMAGE" bash -c "$SCRIPT"

  workflow-complete:
    name: "Integration Tests Complete"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fs-test
      - client-test
      - fstab
      - asan
      - metrics
      - test-rpm
      - packaging
      - test-packages
    steps:
      - name: Verify jobs succeeded
        run: echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
