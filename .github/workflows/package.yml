name: Packaging

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]
  merge_group:
    types: [ "checks_requested" ]

permissions:
  contents: read

jobs:
  packages:
    name: Package ${{ matrix.runner.name }}
    runs-on: ${{ matrix.runner.tags }}

    strategy:
      matrix:
        runner:
        - name: x86_64
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: aarch64
          tags: [self-hosted, linux, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install operating system dependencies
        uses: ./.github/actions/install-dependencies
        with:
          fuseVersion: 2
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: mountpoint-builder
          context: ./package
          # https://github.com/docker/buildx/issues/379
          ulimit: nofile=100000
      - name: Package an unofficial release
        run: docker run --mount type=bind,source=$(pwd),target=/mountpoint mountpoint-builder
      - name: Check release binary
        run: mkdir ./pkg-out && tar -xzf ./out/mount-s3*.tar.gz -C ./pkg-out && ./pkg-out/bin/mount-s3 --version
      - name: Upload unofficial packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.runner.name }}
          path:  ./out/*
          retention-days: 3
          if-no-files-found: error

  # Compares the stripped size of the packaged `mount-s3` against the latest release, and fails if it
  # grew by more than the budget. A separate job, so that an over-budget binary doesn't fail the
  # packaging check.
  binary-size:
    name: Binary size ${{ matrix.runner.name }}
    needs: packages
    runs-on: ${{ matrix.runner.tags }}

    strategy:
      matrix:
        runner:
        - name: x86_64
          release_arch: x86_64
          tags: [ubuntu-22.04] # GitHub-hosted
        - name: aarch64
          release_arch: arm64
          tags: [self-hosted, linux, arm64]

    env:
      # Allowed growth of the stripped binary over the latest release: 10 MiB.
      SIZE_BUDGET_BYTES: 10485760

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download unofficial packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.runner.name }}
          path: ./out
      - name: Download latest release
        run: curl --fail --silent --show-error --location --retry 3 --output ./latest.tar.gz "https://s3.amazonaws.com/mountpoint-s3-release/latest/${{ matrix.runner.release_arch }}/mount-s3.tar.gz"
      - name: Check binary size
        run: .github/actions/scripts/check-binary-size.sh ./latest.tar.gz ./out/mount-s3*.tar.gz
