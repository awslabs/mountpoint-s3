[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
version = ">= 0.13.0, < 0.18.0"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (https://rustsec.org/advisories/RUSTSEC-2026-0543). It only comes in through s3s, a dependency of the s3-mock-server dev-dependency of mountpoint-s3-fs. Ignore the unmaintained warning until s3s moves off chrono." },
]
